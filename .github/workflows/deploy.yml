# Build del sito statico e pubblicazione sul branch "deploy".
# Il server Netsons scarica il branch "deploy" ogni 30 minuti (cron in cPanel) e lo copia in public_html: nessuna password FTP.
# Parte a ogni push su main e ogni giorno alle 05:00 UTC, così gli articoli programmati con data futura escono da soli.
name: Build e deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build
        run: cd src && python build.py && python check_links.py
      - name: Pubblica sul branch deploy
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "RAM deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build $(date -u +%Y-%m-%dT%H:%MZ) da ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
